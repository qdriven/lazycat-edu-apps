# ============================================================
# OpenMAIC · 懒猫微服运行结构（lzc-manifest.yml）
#
# 设计依据（上游 Dockerfile / docker-compose.yml）：
#   * Next.js standalone 单容器，监听 :3000，node:22-alpine（多架构）。
#   * 持久化目录 /app/data（上游 compose 的 openmaic-data volume）。
#   * LLM Provider 全部可选：可在安装时通过部署参数预置（见
#     lzc-deploy-params.yml），也可安装后在应用内 / server-providers.yml
#     配置。环境变量为空等同未设置。
# ============================================================
services:
  openmaic:
    # 本仓库 openmaic/Dockerfile 构建的镜像；推送并 copy-image 到懒猫
    # Registry 后替换为实际地址（docs/DEPLOY-GUIDE.md 有完整步骤）
    image: registry.lazycat.cloud/qdriven/openmaic:0.1.0
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      # 安装期可选部署参数（留空 = 不配置，进应用后再设）
      - OPENAI_API_KEY={{ .U.openai_api_key | default "" }}
      - OPENAI_BASE_URL={{ .U.openai_base_url | default "" }}
      - DEEPSEEK_API_KEY={{ .U.deepseek_api_key | default "" }}
      - QWEN_API_KEY={{ .U.qwen_api_key | default "" }}
      # ---- 可选：共享 PostgreSQL（需配合 PG fork 版镜像，见 docs/POSTGRES-SHARED.md）
      # 原版 OpenMAIC 课程数据存在浏览器 IndexedDB（Dexie），服务端无数据库，
      # 官方镜像不读取此变量；fork 版新增服务端课程 API 后取消下行注释：
      # - DATABASE_URL=postgresql://edu:<密码>@127.0.0.1:5432/edu_openmaic
    binds:
      - /lzcapp/var/data:/app/data

application:
  route:
    - /=http://127.0.0.1:3000
